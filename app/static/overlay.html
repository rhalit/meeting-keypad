<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>Meeting Keypad overlay</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="card" class="card" data-kind="term">
      <button id="close" class="close" aria-label="Close" title="Close">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" /></svg>
      </button>
      <section class="term-view">
        <h1 id="title"></h1>
        <span id="chip" class="chip"></span>
        <p id="explanation" class="explanation"></p>
        <div id="example-label" class="label">In this meeting</div>
        <blockquote id="example" class="example"></blockquote>
      </section>
      <section class="text-view">
        <div id="text-eyebrow" class="eyebrow"></div>
        <h2 id="text-title" class="text-title"></h2>
        <div id="text-body" class="text-body"></div>
      </section>
      <div class="track"><div id="bar" class="bar"></div></div>
    </div>
    <script src="../dist/renderer/overlayCard.js"></script>
  </body>
</html>
