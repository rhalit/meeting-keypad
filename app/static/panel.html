<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>Meeting Keypad</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header>
      <div class="topbar">
        <span id="summary" class="summary">Mock · Meeting</span>
        <button id="settings-btn" title="Source, mode, theme and key colours">⚙ Settings</button>
      </div>
      <section id="settings" class="settings" hidden>
        <div class="setting">
          <span class="setting-name">Source</span>
          <div class="modes" role="tablist">
            <button id="mode-mock" class="active">Mock</button><button id="mode-live">Live</button>
          </div>
        </div>
        <div class="setting">
          <span class="setting-name">Mode</span>
          <div class="modes" role="tablist" title="Meeting: Catch-up · Save · For me?   Education: Flashcard · Quiz me · Explain simply">
            <button id="usage-meeting" class="active">Meeting</button><button id="usage-education">Education</button>
          </div>
        </div>
        <div class="setting">
          <span class="setting-name">Scenario</span>
          <select id="scenario" title="Mock content for this mode"></select>
        </div>
        <div class="setting">
          <span class="setting-name">Theme</span>
          <div class="modes" role="tablist">
            <button id="theme-dark" class="active">Dark</button><button id="theme-light">Light</button>
          </div>
        </div>
        <div class="setting top">
          <span class="setting-name">Key backgrounds</span>
          <div class="colors">
            <label class="color"><input id="bg-terms" type="color" value="#000000" /><span>Term keys (1–6)</span></label>
            <label class="color"><input id="bg-6" type="color" value="#000000" /><span id="bg-6-name">Bottom left</span></label>
            <label class="color"><input id="bg-7" type="color" value="#000000" /><span id="bg-7-name">Bottom middle</span></label>
            <label class="color"><input id="bg-8" type="color" value="#000000" /><span id="bg-8-name">Bottom right</span></label>
            <button id="bg-reset">Reset to black</button>
          </div>
        </div>
      </section>
      <div id="mock-controls" class="controls">
        <button id="play" class="primary">Play</button>
        <button id="restart">Restart</button>
        <span class="speed">
          <button id="speed1" class="active">1x</button><button id="speed2">2x</button>
        </span>
      </div>
      <div id="live-controls" class="live" hidden>
        <div class="controls">
          <button id="listen" class="primary">Start listening</button>
          <input id="keyterms" type="text" placeholder="Meeting topic / keyterms, comma-separated" spellcheck="false" />
        </div>
        <div class="audio-row">
          <div class="meter" title="System audio level"><div id="meter-fill"></div></div>
          <span id="audio-text">Audio: off</span>
        </div>
        <div class="status"><span id="stt-text">Speech-to-text: idle</span></div>
        <div class="status"><span id="spotter-text">Spotter: idle</span></div>
        <div id="learned" class="learned" hidden></div>
        <div id="live-error" class="llm-banner" hidden></div>
      </div>
      <div class="status">
        <span id="time">0:00 / 0:00</span>
        <span id="plugin">Keypad not connected</span>
      </div>
      <div class="status"><span id="llm" class="llm-checking">Model: checking…</span></div>
      <div class="status export-row">
        <span id="export-text"></span>
        <button id="export" title="Write output/meetings/&lt;date time&gt;.md and show it in Finder">Export meeting</button>
      </div>
      <div id="llm-error" class="llm-banner" hidden></div>
      <div class="camera">
        <div class="status">
          <span id="camera-text">Camera: off</span>
          <span id="focus-pill" class="pill">Focus: unknown</span>
        </div>
        <div class="controls">
          <button id="sim-away">Simulate away</button>
          <button id="sim-mention">Simulate mention</button>
          <button id="gaze-calibrate">Calibrate gaze</button>
        </div>
        <div id="camera-error" class="llm-banner" hidden></div>
      </div>
    </header>
    <section>
      <h2>Keypad</h2>
      <div id="grid" class="grid"></div>
      <div id="queue" class="queue"></div>
    </section>
    <section class="grow">
      <h2>Transcript</h2>
      <div id="transcript" class="transcript"></div>
    </section>
    <script src="../dist/renderer/panel.js"></script>
  </body>
</html>
