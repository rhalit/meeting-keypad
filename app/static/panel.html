<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>Meeting Keypad</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header>
      <div class="controls">
        <button id="play" class="primary">Play</button>
        <button id="restart">Restart</button>
        <span class="speed">
          <button id="speed1" class="active">1x</button><button id="speed2">2x</button>
        </span>
      </div>
      <div class="status">
        <span id="time">0:00 / 0:00</span>
        <span id="plugin">Keypad not connected</span>
      </div>
      <div class="status"><span id="llm" class="llm-checking">Model: checking…</span></div>
      <div id="llm-error" class="llm-banner" hidden></div>
    </header>
    <section>
      <h2>Keypad</h2>
      <div id="grid" class="grid"></div>
      <div id="queue" class="queue"></div>
    </section>
    <section class="grow">
      <h2>Transcript</h2>
      <div id="transcript" class="transcript"></div>
    </section>
    <script src="../dist/renderer/panel.js"></script>
  </body>
</html>
